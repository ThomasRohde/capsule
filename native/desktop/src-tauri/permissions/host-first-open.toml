[[permission]]
identifier = "allow-host-first-open"
description = "Allows only the trusted bundled main host shell to open a user-selected capsule, read sanitized launch, lifecycle, comparison, reconciliation, application-upgrade, signing, and host-update reports, use host-owned pickers, create and verify new copies under one-use authority, record an explicit first-open decision, restore a verified copy, export a redacted support bundle, and administer local trust with bounded actions. Raw application WebViews receive none of these commands."
commands.allow = ["startup_report", "cabinet_status", "open_recent_capsule", "choose_compare_capsule", "start_compare", "get_compare_page", "reveal_compare_page", "get_compare_application_detail", "close_compare_session", "get_reconcile_options", "start_reconcile_review", "choose_reconcile_destination", "choose_reconcile_ancestor", "prepare_reconcile", "execute_reconcile", "get_reconcile_operation", "cancel_reconcile_operation", "acknowledge_reconcile_result", "preview_copy_profile", "choose_copy_destination", "cancel_copy_destination", "prepare_copy", "execute_copy", "get_copy_operation", "cancel_copy_operation", "acknowledge_copy_result", "choose_upgrade_release", "choose_upgrade_destination", "prepare_upgrade", "execute_upgrade", "get_upgrade_operation", "cancel_upgrade_operation", "acknowledge_upgrade_result", "lifecycle_status", "update_status", "check_host_update", "download_host_update", "stage_host_update", "open_capsule_picker", "recover_selected_capsule", "reopen_current_capsule", "continue_current_read_only", "restore_backup_picker", "export_support_bundle_picker", "signing_status", "select_signing_key_picker", "select_signing_source_picker", "select_signing_output_picker", "prepare_signing", "execute_signing", "clear_signing_session", "first_open_decide", "open_selected_capsule", "trust_admin"]
