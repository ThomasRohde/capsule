[workspace]
members = [
  "crates/capsule-core",
  "crates/capsule-crypto",
  "crates/capsule-cli",
  "crates/capsule-launch",
  "crates/capsule-lifecycle",
  "crates/capsule-policy",
  "crates/capsule-runtime",
  "crates/capsule-distribution",
  "crates/capsule-platform",
  "crates/capsule-sigstore",
  "crates/capsule-update",
  "crates/capsule-installer",
  "desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/sqlite-capsule/sqlite-capsule"
rust-version = "1.97"

[workspace.dependencies]
base64 = "=0.22.1"
ed25519-dalek = { version = "=3.0.0", features = ["signature"] }
getrandom = "=0.4.3"
libc = "=0.2.189"
minisign-verify = "=0.2.5"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rusqlite = { version = "=0.40.1", features = ["backup", "bundled", "hooks", "limits", "load_extension"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.11.0"
sigstore-verify = { version = "=0.11.0", default-features = false }
tauri = { version = "=2.11.5", features = ["unstable"] }
tauri-build = "=2.6.3"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
thiserror = "=2.0.20"
windows-sys = "=0.61.2"
wry = "=0.55.1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
