[[permission]]
identifier = "allow-host-first-open"
description = "Allows only the trusted bundled host shell to open a user-selected capsule, read sanitized launch, lifecycle, and host-update health reports, explicitly request a metadata-only pinned updater check, download and durably stage a cryptographically accepted update after separate consent and capsule preflight, record an explicit first-open decision, restore a verified copy to a new user-selected path, export a redacted support bundle through a host-owned picker, and administer local trust with bounded actions."
commands.allow = ["startup_report", "lifecycle_status", "update_status", "check_host_update", "download_host_update", "stage_host_update", "open_capsule_picker", "reopen_current_capsule", "continue_current_read_only", "restore_backup_picker", "export_support_bundle_picker", "first_open_decide", "trust_admin"]
