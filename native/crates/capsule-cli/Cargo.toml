[package]
name = "sqlite-capsule-cli"
version = "0.3.0"
description = "Native inspection and publisher-signature CLI for SQLite Capsules"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "capsule-native"
path = "src/main.rs"

[dependencies]
rusqlite.workspace = true
serde_json.workspace = true
sqlite-capsule-core = { path = "../capsule-core" }
sqlite-capsule-crypto = { path = "../capsule-crypto" }
sqlite-capsule-launch = { path = "../capsule-launch" }
sqlite-capsule-policy = { path = "../capsule-policy" }
sqlite-capsule-signing = { path = "../capsule-signing" }
sqlite-capsule-workspace = { path = "../capsule-workspace" }
